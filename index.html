<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Butter Moon Cruise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #1d6a98; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d6a98; } }
      :root[data-theme="dark"] { --bg: #1d6a98; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
      canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
